[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turn-taking-eval"
version = "0.1.0"
description = "Audio-based START/WAIT evaluation for multi-party turn-taking (dataset schema v2)"
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["turn_taking_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
